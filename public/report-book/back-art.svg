<g id="mp"><path d="M0 -66 C11.5 -44 11.5 -22 0 0 C-11.5 -22 -11.5 -44 0 -66 Z" fill="none" stroke="#dfb564" stroke-width="1.7" stroke-linejoin="round"/><path d="M0 -50 C5 -30 4 -14 0 -1" fill="none" stroke="#c99a8b" stroke-width="1.2" stroke-linecap="round"/></g>
