  </g>
  <g id="coin">
    <ellipse cx="0" cy="0" rx="16.5" ry="16.5" fill="#dfb564" stroke="#a67c00" stroke-width="1.6"/>
    <ellipse cx="0" cy="0" rx="11.2" ry="11.2" fill="none" stroke="#fbe09b" stroke-width="1.4"/>
    <ellipse cx="0" cy="0" rx="3.2" ry="3.2" fill="#fbe09b"/>
    <circle cx="0" cy="0" r="1" fill="#a67c00" opacity="0.9"/>
