<!-- kalash body -->
<path d="M245.5 115.5 C245.5 107 262 104.2 300 104.2 C338 104.2 354.5 107 354.5 115.5 L347.8 122.8 L341.2 135.5 C350.2 152.2 369.5 172.5 350.8 204.2 C341.2 220.5 329.5 230.2 322.2 238.2 L331 244.8 L269 244.8 L277.8 238.2 C270.5 230.2 258.8 220.5 249.2 204.2 C230.5 172.5 249.8 152.2 258.8 135.5 L252.2 122.8Z" fill="#0f1633" stroke="#dfb564" stroke-width="2.1" stroke-linejoin="round"/>
