<use href="#petal" transform="translate(323 105) rotate(38) scale(0.9)"/>
<use href="#petal" transform="translate(292 92) rotate(-14) scale(0.82)"/>
<use href="#petal" transform="translate(308 92) rotate(14) scale(0.82)"/>
<use href="#petal" transform="translate(265 116) rotate(-68) scale(0.72)"/>
<use href="#petal" transform="translate(335 116) rotate(68) scale(0.72)"/>

