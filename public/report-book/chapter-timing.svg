<use href="#pI" transform="rotate(0) translate(0 -30)"/><use href="#pI" transform="rotate(45) translate(0 -30)"/><use href="#pI" transform="rotate(90) translate(0 -30)"/><use href="#pI" transform="rotate(135) translate(0 -30)"/><use href="#pI" transform="rotate(180) translate(0 -30)"/><use href="#pI" transform="rotate(225) translate(0 -30)"/><use href="#pI" transform="rotate(270) translate(0 -30)"/><use href="#pI" transform="rotate(315) translate(0 -30)"/>
