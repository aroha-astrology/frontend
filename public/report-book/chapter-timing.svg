<line y1="-85" y2="-69"/><g transform="rotate(30)"><line y1="-85" y2="-69"/></g><g transform="rotate(60)"><line y1="-85" y2="-69"/></g><g transform="rotate(90)"><line y1="-85" y2="-69"/></g><g transform="rotate(120)"><line y1="-85" y2="-69"/></g><g transform="rotate(150)"><line y1="-85" y2="-69"/></g><g transform="rotate(180)"><line y1="-85" y2="-69"/></g><g transform="rotate(210)"><line y1="-85" y2="-69"/></g><g transform="rotate(240)"><line y1="-85" y2="-69"/></g><g transform="rotate(270)"><line y1="-85" y2="-69"/></g><g transform="rotate(300)"><line y1="-85" y2="-69"/></g><g transform="rotate(330)"><line y1="-85" y2="-69"/></g>
</g>
<!-- ticks on outer rim -->
<g stroke="#fbe09b" stroke-width="1.4" stroke-linecap="round">
<g transform="rotate(0)"><line y1="-92" y2="-88"/></g><g transform="rotate(30)"><line y1="-92" y2="-88"/></g><g transform="rotate(60)"><line y1="-92" y2="-88"/></g><g transform="rotate(90)"><line y1="-92" y2="-88"/></g><g transform="rotate(120)"><line y1="-92" y2="-88"/></g><g transform="rotate(150)"><line y1="-92" y2="-88"/></g><g transform="rotate(180)"><line y1="-92" y2="-88"/></g><g transform="rotate(210)"><line y1="-92" y2="-88"/></g><g transform="rotate(240)"><line y1="-92" y2="-88"/></g><g transform="rotate(270)"><line y1="-92" y2="-88"/></g><g transform="rotate(300)"><line y1="-92" y2="-88"/></g><g transform="rotate(330)"><line y1="-92" y2="-88"/></g>
