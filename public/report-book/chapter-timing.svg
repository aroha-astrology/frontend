<circle r="88.5" fill="none" stroke="#a67c00" stroke-width="1"/>
<circle r="85" fill="url(#g1)" stroke="#dfb564" stroke-width="1.4"/>
<circle r="69" fill="none" stroke="#dfb564" stroke-width="1.3"/>
<circle r="67" fill="none" stroke="#dfb564" stroke-width="0.7" opacity="0.6"/>
<circle r="54" fill="none" stroke="#dfb564" stroke-width="1.2"/>
<circle r="23" fill="none" stroke="#dfb564" stroke-width="1.2"/>
<circle r="20" fill="none" stroke="#a67c00" stroke-width="0.7"/>
