<circle r="7.2" fill="#dfb564" stroke="#fbe09b" stroke-width="0.7"/>
<circle r="2.2" fill="#f3ecd9" stroke="none"/>
<circle r="1" fill="#dfb564" opacity="0.9"/>
<!-- small crescent accents at cardinal inner -->
<g fill="none" stroke="#c99a8b" stroke-width="1.05" opacity="0.9" stroke-linecap="round">
<path d="M0 -61 A6 6 0 0 1 3.2 -55.5 A4.5 4.5 0 0 0 0 -61" transform="rotate(0)"/>
<path d="M0 -61 A6 6 0 0 1 3.2 -55.5 A4.5 4.5 0 0 0 0 -61" transform="rotate(90)"/>
<path d="M0 -61 A6 6 0 0 1 3.2 -55.5 A4.5 4.5 0 0 0 0 -61" transform="rotate(180)"/>
