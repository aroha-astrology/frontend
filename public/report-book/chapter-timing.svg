<g stroke="#dfb564" stroke-width="0.9" opacity="0.9">
<g transform="rotate(15)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(45)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(75)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(105)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(135)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(165)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(195)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(225)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(255)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(285)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(315)"><line y1="-88.5" y2="-86"/></g><g transform="rotate(345)"><line y1="-88.5" y2="-86"/></g>
</g>
</g>
<!-- 12 tiny stars in segments -->
<g>
<use href="#st" transform="rotate(15) translate(0 -77)"/><use href="#st" transform="rotate(45) translate(0 -77)"/><use href="#st" transform="rotate(75) translate(0 -77)"/><use href="#st" transform="rotate(105) translate(0 -77)"/><use href="#st" transform="rotate(135) translate(0 -77)"/><use href="#st" transform="rotate(165) translate(0 -77)"/><use href="#st" transform="rotate(195) translate(0 -77)"/><use href="#st" transform="rotate(225) translate(0 -77)"/><use href="#st" transform="rotate(255) translate(0 -77)"/><use href="#st" transform="rotate(285) translate(0 -77)"/><use href="#st" transform="rotate(315) translate(0 -77)"/><use href="#st" transform="rotate(345) translate(0 -77)"/>
</g>
<!-- 12 dots on middle ring -->
<g>
<use href="#dot" transform="rotate(0) translate(0 -61)"/><use href="#dot" transform="rotate(30) translate(0 -61)"/><use href="#dot" transform="rotate(60) translate(0 -61)"/><use href="#dot" transform="rotate(90) translate(0 -61)"/><use href="#dot" transform="rotate(120) translate(0 -61)"/><use href="#dot" transform="rotate(150) translate(0 -61)"/><use href="#dot" transform="rotate(180) translate(0 -61)"/><use href="#dot" transform="rotate(210) translate(0 -61)"/><use href="#dot" transform="rotate(240) translate(0 -61)"/><use href="#dot" transform="rotate(270) translate(0 -61)"/><use href="#dot" transform="rotate(300) translate(0 -61)"/><use href="#dot" transform="rotate(330) translate(0 -61)"/>
</g>
<!-- inner 8 lotus -->
