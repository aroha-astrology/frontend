<svg width="600" height="40" viewBox="0 0 600 40" xmlns="http://www.w3.org/2000/svg" role="img">
<defs>
<linearGradient id="fadeL" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#dfb564" stop-opacity="0"/>
<stop offset="75%" stop-color="#dfb564" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#dfb564" stop-opacity="1"/>
</linearGradient>
<linearGradient id="fadeR" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#dfb564" stop-opacity="1"/>
<stop offset="25%" stop-color="#dfb564" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#dfb564" stop-opacity="0"/>
</linearGradient>
<path id="petal" d="M0,-10 C2.8,-6.2 3.7,-2.8 0,4.2 C-3.7,-2.8 -2.8,-6.2 0,-10 Z"/>
<g id="diamondS"><rect x="-3" y="-3" width="6" height="6" transform="rotate(45)" fill="#f3ecd9" stroke="#dfb564" stroke-width="1.3"/></g>
<g id="diamondL"><rect x="-3.9" y="-3.9" width="7.8" height="7.8" transform="rotate(45)" fill="none" stroke="#dfb564" stroke-width="1.4"/></g>
</defs>
<!-- faded horizontal lines -->
<line x1="12" y1="20" x2="283.5" y2="20" stroke="url(#fadeL)" stroke-width="1.5" stroke-linecap="round"/>
<line x1="316.5" y1="20" x2="588" y2="20" stroke="url(#fadeR)" stroke-width="1.5" stroke-linecap="round"/>
<!-- delicate ticks on line -->
<g stroke="#dfb564" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
<line x1="145" y1="17.2" x2="145" y2="22.8"/>
<line x1="112" y1="18" x2="112" y2="22"/>
<line x1="455" y1="17.2" x2="455" y2="22.8"/>
<line x1="488" y1="18" x2="488" y2="22"/>
</g>
<g stroke="#a67c00" stroke-width="1.2" stroke-linecap="round" opacity="0.9">
<line x1="76" y1="18.6" x2="76" y2="21.4"/>
<line x1="524" y1="18.6" x2="524" y2="21.4"/>
</g>
<!-- small dots on far ends -->
<circle cx="76" cy="20" r="1.2" fill="#dfb564"/>
<circle cx="112" cy="20" r="1.15" fill="#fbe09b"/>
<circle cx="145" cy="20" r="1.2" fill="#dfb564"/>
<circle cx="524" cy="20" r="1.2" fill="#dfb564"/>
<circle cx="488" cy="20" r="1.15" fill="#fbe09b"/>
<circle cx="455" cy="20" r="1.2" fill="#dfb564"/>
<!-- mid diamonds and dots left -->
<g transform="translate(188,20)"><use href="#diamondL"/></g>
<circle cx="188" cy="20" r="0.9" fill="#dfb564"/>
<circle cx="188" cy="13.2" r="0.85" fill="#c99a8b"/>
<circle cx="188" cy="26.8" r="0.85" fill="#c99a8b"/>
<circle cx="216.5" cy="20" r="1.35" fill="#dfb564"/>
<circle cx="216.5" cy="20" r="0.45" fill="#0f1633"/>
<g transform="translate(244,20)"><use href="#diamondS"/></g>
<circle cx="244" cy="20" r="0.55" fill="#a67c00"/>
<circle cx="268.2" cy="20" r="1.4" fill="#dfb564"/>
<circle cx="281.2" cy="20" r="1.05" fill="#fbe09b" stroke="#dfb564" stroke-width="1"/>
<!-- mid diamonds and dots right - mirrored -->
<g transform="translate(412,20)"><use href="#diamondL"/></g>
<circle cx="412" cy="20" r="0.9" fill="#dfb564"/>
<circle cx="412" cy="13.2" r="0.85" fill="#c99a8b"/>
<circle cx="412" cy="26.8" r="0.85" fill="#c99a8b"/>
<circle cx="383.5" cy="20" r="1.35" fill="#dfb564"/>
<circle cx="383.5" cy="20" r="0.45" fill="#0f1633"/>
<g transform="translate(356,20)"><use href="#diamondS"/></g>
<circle cx="356" cy="20" r="0.55" fill="#a67c00"/>
<circle cx="331.8" cy="20" r="1.4" fill="#dfb564"/>
<circle cx="318.8" cy="20" r="1.05" fill="#fbe09b" stroke="#dfb564" stroke-width="1"/>
<!-- centre lotus -->
<g transform="translate(300,20)">
<!-- mandala rings behind lotus -->
<circle r="11.2" fill="none" stroke="#dfb564" stroke-width="1.2" opacity="1"/>
<circle r="13.6" fill="none" stroke="#dfb564" stroke-width="1" opacity="0.38"/>
<!-- tiny tick dots on outer ring -->
<g fill="#dfb564">
<circle cx="0" cy="-13.6" r="0.75"/>
<circle cx="12.85" cy="-4.42" r="0.65"/>
<circle cx="7.95" cy="11.02" r="0.65"/>
<circle cx="-7.95" cy="11.02" r="0.65"/>
<circle cx="-12.85" cy="-4.42" r="0.65"/>
</g>
<!-- lotus petals -->
<g stroke="#dfb564" stroke-linejoin="round">
<!-- outer smaller petals -->
<use href="#petal" transform="rotate(-38) scale(0.72) translate(0,0.6)" fill="#1b2550" stroke-width="1.3"/>
<use href="#petal" transform="rotate(38) scale(0.72) translate(0,0.6)" fill="#1b2550" stroke-width="1.3"/>
<!-- mid petals -->
<use href="#petal" transform="rotate(-19) scale(0.88) translate(0,0.3)" fill="#f3ecd9" stroke-width="1.3"/>
<use href="#petal" transform="rotate(19) scale(0.88) translate(0,0.3)" fill="#f3ecd9" stroke-width="1.3"/>
<!-- central petal -->
<use href="#petal" transform="scale(1.02)" fill="#f3ecd9" stroke-width="1.4"/>
</g>
<!-- base small crescent-like cup -->
<path d="M-6.2,4 C-3.8,7.2 -1.2,8.4 0,8.4 C1.2,8.4 3.8,7.2 6.2,4 C3.9,5.2 1.8,5.7 0,5.7 C-1.8,5.7 -3.9,5.2 -6.2,4 Z" fill="none" stroke="#dfb564" stroke-width="1.2" stroke-linejoin="round"/>
<!-- centre dot -->
<circle r="1.85" fill="#dfb564" stroke="#fbe09b" stroke-width="0.7"/>
<circle r="0.6" fill="#0f1633" opacity="0.95"/>
<!-- tiny stars above lotus -->
<g fill="#dfb564" opacity="0.95">
<path d="M0,-14.2 l0.6,1.25 1.25,0.6 -1.25,0.6 -0.6,1.25 -0.6,-1.25 -1.25,-0.6 1.25,-0.6z"/>
</g>
</g>
<!-- tiny crescent moons flanking lotus -->
<g fill="none" stroke="#dfb564" stroke-width="1.15">
<path d="M282.2,12.8 A4.2,4.2 0 1 0 282.2,14.9 A2.9,2.9 0 1 1 282.2,12.8 Z" fill="#f3ecd9" opacity="0.95"/>
<path d="M317.8,12.8 A4.2,4.2 0 1 1 317.8,14.9 A2.9,2.9 0 1 0 317.8,12.8 Z" fill="#f3ecd9" opacity="0.95"/>
</g>
</svg>